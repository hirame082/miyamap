<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みやま市ローカルマップ (管理・開発用)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0f172a; font-family: sans-serif; overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: #0f172a; }
        .custom-div-icon { background: none; border: none; }
        
        .leaflet-popup-content-wrapper {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.5) !important;
            min-width: 280px !important;
        }
        .leaflet-popup-content { margin: 12px !important; width: auto !important; }
        .leaflet-popup-tip {
            background-color: #0f172a !important;
            border-left: 1px solid #334155 !important;
            border-bottom: 1px solid #334155 !important;
        }

        .leaflet-bar { border: none !important; box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; }
        .leaflet-bar a {
            background-color: #0f172a !important; color: #94a3b8 !important; border: 1px solid #1e293b !important;
            border-top: none !important; width: 40px !important; height: 40px !important; line-height: 40px !important;
            font-size: 16px !important; transition: all 0.2s; display: flex !important; align-items: center; justify-content: center;
        }
        .leaflet-bar a:hover { background-color: #1e293b !important; color: #ffffff !important; }
        .leaflet-bar a:last-child { border-bottom-left-radius: 12px !important; border-bottom-right-radius: 12px !important; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #loading.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="relative flex w-full h-full text-slate-200">

    <div id="loading"><div class="spinner"></div></div>

    <!-- 左側サイドバーセクション -->
    <div id="sidebar" class="w-[320px] h-full bg-slate-900/95 backdrop-blur-md border-r border-slate-800 flex flex-col shrink-0 z-[1000] transition-all duration-300 relative">
        <div class="p-4 border-b border-slate-800 flex flex-col gap-3 bg-slate-950/40">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="material-icons text-amber-400">construction</span>
                    <h1 class="font-bold text-sm tracking-wide text-white">みやま市マップ (管理用)</h1>
                </div>
                <button id="btn-info" class="text-slate-400 hover:text-emerald-400 transition-colors cursor-pointer">
                    <span class="material-icons text-xl">info</span>
                </button>
            </div>
            
            <!-- 閲覧/編集モード切り替えトグル -->
            <div class="flex bg-slate-950/60 p-1 rounded-xl border border-slate-800">
                <button id="mode-view" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 bg-emerald-600 text-white cursor-pointer">
                    <span class="material-icons text-sm">visibility</span>閲覧中
                </button>
                <button id="mode-edit" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 text-slate-400 hover:text-slate-200 cursor-pointer">
                    <span class="material-icons text-sm">edit</span>編集する
                </button>
            </div>
        </div>

        <!-- 検索・絞り込みエリア -->
        <div class="p-4 flex flex-col gap-3 border-b border-slate-800/60">
            <div class="relative">
                <span class="material-icons absolute left-3 top-2.5 text-slate-500 text-sm">search</span>
                <input type="text" id="search-input" placeholder="店名や住所で検索..." class="w-full bg-slate-950/60 border border-slate-800 focus:border-slate-700 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 outline-none placeholder:text-slate-600 transition-all font-bold">
            </div>

            <!-- カテゴリの折り畳み（アコーディオン） -->
            <details class="group bg-slate-950/40 border border-slate-800/80 rounded-xl overflow-hidden">
                <summary class="flex justify-between items-center px-3 py-2.5 text-xs font-bold text-slate-300 cursor-pointer hover:bg-slate-900/40 select-none list-none [&::-webkit-details-marker]:hidden">
                    <div class="flex items-center gap-1.5">
                        <span class="material-icons text-slate-500 text-sm">filter_alt</span>
                        <span>カテゴリを絞り込む</span>
                    </div>
                    <span class="material-icons text-slate-500 text-sm transition-transform duration-200 group-open:rotate-180">expand_more</span>
                </summary>
                
                <!-- チェックボックスのエリア -->
                <div id="filter-checkboxes-container" class="px-3 pb-3 pt-1 flex flex-col gap-2 border-t border-slate-900/60 bg-slate-950/20"></div>
            </details>
        </div>

        <!-- スポット一覧 -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2.5 bg-slate-900/30" id="spot-list-container">
            <div id="list-counter" class="text-[10px] text-slate-500 font-bold tracking-wider px-1">該当スポット: 0 件</div>
            <div id="spot-list" class="flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- 左下操作コンテナ -->
    <div class="absolute bottom-6 left-6 z-[1001] flex flex-col shadow-2xl rounded-xl overflow-hidden">
        <button id="toggle-sidebar" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white w-10 h-10 flex items-center justify-center transition-all cursor-pointer rounded-t-xl">
            <span class="material-icons" id="sidebar-icon">menu_open</span>
        </button>
        <div id="zoom-control-wrapper" class="flex flex-col"></div>
    </div>

    <!-- メイン地図領域 -->
    <div class="flex-1 h-full relative">
        <div id="map"></div>
        <button id="btn-reset-view" class="absolute bottom-6 right-6 z-[1000] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white w-10 h-10 rounded-xl shadow-2xl flex items-center justify-center transition-all cursor-pointer">
            <span class="material-icons">my_location</span>
        </button>
    </div>

    <!-- Infoモーダル -->
    <div id="info-modal" class="fixed inset-0 z-[2000] hidden items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-slate-900 border border-slate-800 w-[90%] max-w-md p-6 rounded-2xl shadow-2xl flex flex-col gap-4 text-slate-300">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2 font-bold text-white text-sm">
                    <span class="material-icons text-amber-400 text-lg">construction</span>
                    <span>管理用マップについて</span>
                </div>
                <button id="close-info" class="text-slate-500 hover:text-slate-300 cursor-pointer"><span class="material-icons">close</span></button>
            </div>
            <div class="text-xs space-y-3 leading-relaxed">
                <p>データ追加用の管理用画面です。大カテゴリ・小カテゴリの構成定義は `json/category.json` を動的に参照しています。</p>
            </div>
        </div>
    </div>

    <!-- 外部ライブラリ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-boundary-canvas@1.0.0/src/BoundaryCanvas.js"></script>

    <!-- JSファイルの読み込み -->
    <script src="js/common.js"></script>
    <script src="js/dev.js"></script>
</body>
</html>
