<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みやま市スポット管理マップ</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- カスタムスタイル -->
    <style>
        /* Leafletの要素重ね順調整 */
        .leaflet-pane { z-index: 10 !important; }
        .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
        /* カスタムピンのアンカー位置調整 */
        .custom-pin { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden font-sans flex">

    <!-- 左側: サイドバー (操作パネル) -->
    <aside class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col z-20 shadow-xl">
        <!-- ヘッダー -->
        <div class="p-4 border-b border-slate-700 flex items-center justify-between">
            <h1 class="font-bold text-sm text-slate-100 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span>
                みやま市マップ管理
            </h1>
            <a href="index.html" class="text-[11px] text-slate-400 hover:text-slate-200 underline">閲覧画面へ</a>
        </div>

        <!-- 編集モード切替ボタン -->
        <div class="p-4 border-b border-slate-700">
            <button id="btn-toggle-mode" class="w-full py-2.5 px-4 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold text-xs rounded-xl transition-all shadow flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span>閲覧モード</span>
            </button>
            <p class="text-[10px] text-slate-400 mt-2 text-center">編集モードに切り替えると地図クリックでスポット登録できます</p>
        </div>

        <!-- カテゴリフィルター一覧 -->
        <div class="p-4 flex-1 overflow-y-auto space-y-3">
            <div class="text-xs font-bold text-slate-400 tracking-wider">カテゴリ絞り込み</div>
            <div id="category-filters" class="space-y-2">
                <!-- dev.js により動的描画 -->
            </div>
        </div>
    </aside>

    <!-- 右側: メインマップ領域 -->
    <main class="flex-1 h-full relative">
        <div id="map" class="w-full h-full bg-slate-950"></div>
    </main>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[3000] px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 pointer-events-none opacity-0 translate-y-10"></div>

    <!-- 新規登録 / 編集 モーダル -->
    <div id="modal-spot" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2000] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 id="modal-spot-title" class="font-bold text-sm text-slate-100">スポット情報の登録</h2>
                <button type="button" onclick="closeSpotModal()" class="text-slate-400 hover:text-slate-100 text-lg">&times;</button>
            </div>

            <form id="form-spot" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">名称 <span class="text-rose-400">*</span></label>
                    <input type="text" id="form-title" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">大カテゴリ <span class="text-rose-400">*</span></label>
                        <select id="form-category-main" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                            <!-- dev.js で動的追加 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">小カテゴリ</label>
                        <select id="form-category-sub" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                            <option value="">小カテゴリを選択</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">住所</label>
                    <input type="text" id="form-address" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">電話番号</label>
                    <input type="tel" id="form-tel" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" onclick="closeSpotModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 削除確認 モーダル -->
    <div id="modal-delete" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2000] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto text-xl font-bold">！</div>
            <div class="space-y-1">
                <h3 class="font-bold text-sm text-slate-100">本当に削除しますか？</h3>
                <p class="text-xs text-slate-400">この操作は取り消せません。</p>
            </div>
            <div class="pt-2 flex justify-center gap-2 text-xs">
                <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold">キャンセル</button>
                <button type="button" onclick="executeDeleteSpot()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold shadow">削除実行</button>
            </div>
        </div>
    </div>

    <!-- JSファイルの読み込み（パス指定: js/common.js → js/dev.js） -->
    <script src="js/common.js"></script>
    <script src="js/dev.js"></script>
</body>
</html>
